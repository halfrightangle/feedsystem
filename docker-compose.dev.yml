name: ${PROJECT_NAME}

services:
  mysql:
    image: mysql:8.0
    restart: always
    container_name: ${PROJECT_NAME}-mysql

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai

    ports:
      - "${HOST_BIND_IP}:${MYSQL_PORT}:3306"

    volumes:
      - ./data/${PROJECT_NAME}/mysql:/var/lib/mysql

    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    networks:
      - dev-network

  redis:
    image: redis:7.4
    restart: always
    container_name: ${PROJECT_NAME}-redis

    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - ""
      - --requirepass
      - ${REDIS_PASSWORD}
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - noeviction

    ports:
      - "${HOST_BIND_IP}:${REDIS_PORT}:6379"

    volumes:
      - ./data/${PROJECT_NAME}/redis:/data

    healthcheck:
      test: ["CMD-SHELL",
           "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    networks:
      - dev-network

  rabbitmq:
    image: rabbitmq:4-management
    restart: always
    container_name: ${PROJECT_NAME}-rabbitmq
    hostname: rabbitmq

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}

    ports:
      - "${HOST_BIND_IP}:${RABBITMQ_PORT}:5672"
      - "${HOST_BIND_IP}:${RABBITMQ_MANAGEMENT_PORT}:15672"

    volumes:
      - ./data/${PROJECT_NAME}/rabbitmq:/var/lib/rabbitmq

    healthcheck:
      test:
        [
          "CMD",
          "rabbitmq-diagnostics",
          "-q",
          "ping"
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

    networks:
      - dev-network

networks:
  dev-network:
    driver: bridge
